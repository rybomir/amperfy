name: Build unsigned iOS IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Archive unsigned iOS app
        # Override project entitlements so the archive doesn't request CarPlay or Siri.
        run: |
          xcodebuild \
            -project Amperfy.xcodeproj \
            -scheme Amperfy \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Amperfy.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            CODE_SIGN_ENTITLEMENTS=

      - name: Package IPA
        run: |
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          ditto "$RUNNER_TEMP/Amperfy.xcarchive/Products/Applications/Amperfy.app" \
            "$RUNNER_TEMP/ipa/Payload/Amperfy.app"
          ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/ipa/Payload" \
            "$RUNNER_TEMP/Amperfy-unsigned.ipa"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Amperfy-unsigned-ipa
          path: ${{ runner.temp }}/Amperfy-unsigned.ipa
          if-no-files-found: error
